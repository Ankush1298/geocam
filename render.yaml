services:
  - type: web
    name: geocam-verification
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --workers 1 --threads 4 --timeout 120 app:app
    healthCheckPath: /healthz
    envVars:
      - key: MAX_UPLOAD_MB
        value: "80"
      # Persistent storage (REQUIRED on Render free - its disk is wiped on every spin-down).
      # Fill these in the Render dashboard; they are secrets so they are not stored here.
      - key: DATABASE_URL        # Postgres connection string (Supabase / Neon)
        sync: false
      - key: S3_ENDPOINT_URL     # e.g. https://<account>.r2.cloudflarestorage.com
        sync: false
      - key: S3_BUCKET
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
