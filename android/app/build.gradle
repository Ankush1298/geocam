plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'dev.flutter.flutter-gradle-plugin'
}

android {
    ndkVersion = "28.2.13676358"
    namespace 'com.example.geocam'
    compileSdk 36

    defaultConfig {
        applicationId 'com.geocam.camera'
        minSdk 24
        targetSdk 36
        versionCode = flutter.versionCode
        versionName = flutter.versionName
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions { jvmTarget = '17' }

    buildTypes {
        release {
            signingConfig signingConfigs.debug
        }
    }

    packaging {
        resources {
            excludes += ['**/._*']
        }
    }
}

flutter { source '../..' }

tasks.configureEach { task ->
    if (task.name.contains("Resource") || task.name.contains("Assets") || task.name.contains("Bundle")) {
        task.doFirst {
            def bDir = file("${project.projectDir}/../../build")
            if (bDir.exists()) {
                fileTree(dir: bDir, include: "**/._*").each { it.delete() }
            }
        }
    }
}
