plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'dev.flutter.flutter-gradle-plugin'
}

android {
    ndkVersion = "28.2.13676358"
    namespace 'com.example.geocam'
    compileSdk 36

    defaultConfig {
        applicationId 'com.geocam.camera'
        minSdk 24
        targetSdk 36
        versionCode = flutter.versionCode
        versionName = flutter.versionName
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions { jvmTarget = '17' }

    buildTypes {
        release {
            signingConfig signingConfigs.debug
        }
    }

    packaging {
        resources {
            excludes += ['**/._*']
        }
    }
}

flutter { source '../..' }

dependencies {
    // CameraTuningBridge reaches the camera owned by the `camera` plugin. Plugin dependencies are
    // not on the app's compile classpath, so CameraX is declared here at the version Gradle already
    // resolves for the app (mobile_scanner requires 1.6.1, camera_android_camerax 1.5.3).
    implementation "androidx.camera:camera-camera2:1.6.1"
    implementation "androidx.camera:camera-lifecycle:1.6.1"
    // The bridge uses CameraX's ListenableFuture results. Gradle resolves the standalone
    // `listenablefuture` artifact to an empty placeholder when other libraries pull in Guava, so the
    // class must come from Guava itself ("Cannot access class 'ListenableFuture'" otherwise).
    implementation "com.google.guava:guava:33.4.0-android"
}

tasks.configureEach { task ->
    if (task.name.contains("Resource") || task.name.contains("Assets") || task.name.contains("Bundle")) {
        task.doFirst {
            def bDir = file("${project.projectDir}/../../build")
            if (bDir.exists()) {
                fileTree(dir: bDir, include: "**/._*").each { it.delete() }
            }
        }
    }
}
